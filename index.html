<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Codex Herbalis</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- Home Screen -->
    <section id="home" class="screen">
      <header>
        <div class="sigil" aria-hidden="true">⚔ 💀 ⚔</div>
        <h1>Codex Herbalis</h1>
        <p class="subtitle">NCBAHM · Trial of Knowledge</p>
      </header>

      <div class="stats-card">
        <div class="stat-label">Imperial Standing</div>
        <div id="overall-score" class="stat-value">—</div>
        <div id="overall-grade" class="grade-badge">—</div>
        <div id="overall-quote" class="rank-quote"></div>
        <div id="overall-detail" class="stat-detail"></div>
      </div>

      <div class="start-section">
        <p class="section-label">Begin a new trial</p>
        <div class="btn-group">
          <button class="btn btn-primary" data-count="10">10 Questions</button>
          <button class="btn btn-primary" data-count="20">20 Questions</button>
          <button class="btn btn-primary" data-count="50">50 Questions</button>
        </div>
        <p id="available-count" class="hint"></p>
      </div>
    </section>

    <!-- Quiz Screen -->
    <section id="quiz" class="screen hidden">
      <header class="quiz-header">
        <div class="quiz-top-row">
          <div id="progress-text">Question 1 / 10</div>
          <button id="exit-btn" class="btn-exit" type="button">Abort</button>
        </div>
        <div class="progress-bar">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
      </header>

      <div class="question-card">
        <p id="question-intro" class="question-intro"></p>
        <p id="question-text" class="question-text"></p>

        <div id="options-container" class="options hidden"></div>

        <button id="reveal-btn" class="btn btn-secondary hidden">Reveal Answer</button>

        <div id="feedback" class="feedback hidden">
          <div id="answer-display" class="answer-display"></div>
          <div id="extra-display" class="extra-display"></div>
          <div id="flashcard-actions" class="btn-group hidden">
            <button id="got-right" class="btn btn-success">For the Emperor</button>
            <button id="got-wrong" class="btn btn-danger">Failure</button>
          </div>
          <button id="next-btn" class="btn btn-primary hidden">Next</button>
        </div>
      </div>
    </section>

    <!-- Results Screen -->
    <section id="results" class="screen hidden">
      <header>
        <h1 id="results-title">Trial Complete</h1>
      </header>

      <div class="stats-card">
        <div class="stat-label">This Trial</div>
        <div id="set-score" class="stat-value">0 / 0</div>
        <div id="set-percent" class="stat-detail"></div>
      </div>

      <div class="stats-card">
        <div class="stat-label">Imperial Standing</div>
        <div id="results-overall" class="stat-value">—</div>
        <div id="results-grade" class="grade-badge">—</div>
        <div id="results-quote" class="rank-quote"></div>
      </div>

      <button id="home-btn" class="btn btn-primary">Return</button>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
